<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-powered deepfake detection using EfficientNet-B4, DCT frequency analysis, and Temporal Attention — detect manipulated media in seconds.">
    <title>DeepScan — Deepfake Detection</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap (local) -->
    <link rel="stylesheet" href="/static/bootstrap/bootstrap.min.css">

    <!-- jQuery UI (local) -->
    <link rel="stylesheet" href="/static/css/jquery-ui.css">

    <!-- Custom styles -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    {% include 'nav-bar.html' %}

    <!-- Loading overlay -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <p class="loading-text">Analyzing media with AI&hellip;</p>
    </div>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include 'footer.html' %}

    <!-- JS -->
    <script src="/static/js/jquery-3.4.1.min.js"></script>
    <script src="/static/js/popper.min.js"></script>
    <script src="/static/js/jquery-ui.min.js"></script>

    {% block js_cripts %}{% endblock %}
</body>
</html>
